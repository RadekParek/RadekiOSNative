plugins { id 'com.android.application' }

def ndkRoot = System.getenv("ANDROID_NDK_ROOT")
def ndkRev = ""
if (ndkRoot) {
    def props = new Properties()
    def f = new File(ndkRoot, "source.properties")
    if (f.isFile()) { f.withInputStream { props.load(it) }; ndkRev = props.getProperty("Pkg.Revision", "") }
}

android {
    namespace 'org.radekiosnative.recompiler'
    compileSdk 34
    if (ndkRev) { ndkVersion ndkRev }
    defaultConfig {
        applicationId "org.radekiosnative.recompiler"
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "0.2.0"
        externalNativeBuild { cmake { cppFlags '-std=c++20'; arguments '-DANDROID_STL=c++_static' } }
    }
    buildFeatures { buildConfig true }
    flavorDimensions += 'guestAbi'
    productFlavors {
        arm64 {
            dimension 'guestAbi'
            ndk { abiFilters 'arm64-v8a' }
        }
        arm32 {
            dimension 'guestAbi'
            ndk { abiFilters 'armeabi-v7a' }
        }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
