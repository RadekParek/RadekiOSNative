name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q RadekiOSNative.zip
      - run: make -C RadekiOSNative SAN=1 test
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q RadekiOSNative.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle -p RadekiOSNative/android assembleDebug --no-daemon
      - run: cp RadekiOSNative/android/app/build/outputs/apk/debug/app-debug.apk RadekiOSNative.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RadekiOSNative-apk
          path: RadekiOSNative.apk
      - name: Publish APK as a release (direct .apk download)
        run: gh release create build-${{ github.run_number }} RadekiOSNative.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
        env:
          GH_TOKEN: ${{ github.token }}
